<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Doubts — LyroWeb Academy</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a href="dashboard.html" class="sidebar__logo">LyroWeb <span>Academy</span></a>
      <div class="sidebar__section-label">Course</div>
      <a href="dashboard.html" class="btn btn-ghost" style="text-align:left;">← Back to lessons</a>
      <a href="doubts.html" class="btn btn-ghost" style="text-align:left;margin-top:8px;">Doubts</a>
      <div class="sidebar__user">
        <div id="user-name">—</div>
        <div class="email" id="user-email">—</div>
        <button class="btn btn-ghost" id="logout-btn" style="margin-top:14px;">Log out</button>
      </div>
    </aside>

    <div>
      <div class="topbar">
        <h1>Doubts</h1>
      </div>

      <main class="main-scroll">
        <form class="doubt-composer" id="doubt-form">
          <textarea id="doubt-input" placeholder="Got stuck somewhere? Ask your doubt here — mention the lesson name if it helps." required></textarea>
          <button type="submit" class="btn btn-primary" id="doubt-submit-btn" style="width:auto;padding:10px 24px;margin-top:10px;">Post doubt</button>
        </form>

        <div id="doubt-list" class="doubt-list"></div>
      </main>
    </div>
  </div>

  <script type="module" src="js/doubts.js"></script>
</body>
</html>
